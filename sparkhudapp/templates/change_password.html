{% extends 'base.html' %}

{% block title %}Change Password - SparkHub{% endblock %}

{% block content %}
<div class="settings-shell">
    <section class="settings-hero">
        <h1>Change Password</h1>
        <p class="mb-0">Choose a strong password to keep your account secure.</p>
    </section>

    <div class="card settings-form-card">
        <div class="card-header">
            <h3 class="mb-1">Password Security</h3>
            <p class="text-muted mb-0">Use a password you do not use anywhere else.</p>
        </div>
        <div class="card-body">
            <form method="post" class="settings-form">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-2 flex-wrap mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Change Password</button>
                    <a href="{% url 'settings' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
