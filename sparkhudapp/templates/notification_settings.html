{% extends 'base.html' %}

{% block title %}Notification Settings - SparkHub{% endblock %}

{% block content %}
<div class="settings-shell">
    <section class="settings-hero">
        <h1>Notification Settings</h1>
        <p class="mb-0">Control which in-app updates SparkHub shows you.</p>
    </section>

    <div class="card settings-form-card">
        <div class="card-header">
            <h3 class="mb-1">In-App Notifications</h3>
            <p class="text-muted mb-0">Keep important updates visible without extra noise.</p>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <label class="settings-option" for="eventNotifications">
                    <input class="form-check-input mt-1" type="checkbox" id="eventNotifications" name="event_notifications" checked>
                    <span><strong>Events</strong><span class="d-block text-muted">Notify me about event updates and registrations.</span></span>
                </label>
                <label class="settings-option" for="commentNotifications">
                    <input class="form-check-input mt-1" type="checkbox" id="commentNotifications" name="comment_notifications" checked>
                    <span><strong>Comments and likes</strong><span class="d-block text-muted">Notify me when people react to my posts.</span></span>
                </label>
                <label class="settings-option" for="pointsNotifications">
                    <input class="form-check-input mt-1" type="checkbox" id="pointsNotifications" name="points_notifications" checked>
                    <span><strong>Points</strong><span class="d-block text-muted">Notify me when I earn SparkHub points.</span></span>
                </label>
                <div class="d-flex gap-2 flex-wrap mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Save</button>
                    <a href="{% url 'settings' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
