{% extends 'base.html' %}

{% block title %}Create Post - SparkHub{% endblock %}

{% block content %}
<h2 class="mb-4">Create Post</h2>

<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="content" class="form-label">Post</label>
                <textarea class="form-control" id="content" name="content" rows="5" placeholder="Share your story or add a video." ></textarea>
            </div>
            <div class="mb-3">
                <label for="video" class="form-label">Upload Video</label>
                <input class="form-control" type="file" id="video" name="video" accept="video/*">
                <div class="form-text">Optional. Upload a video to share in your post.</div>
            </div>
            <button type="submit" class="btn btn-primary">Post</button>
            <a href="{% url 'social_feed' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
