{% extends 'base.html' %}

{% block title %}Create Post - SparkHub{% endblock %}

{% block content %}
<h2 class="mb-4">Create Post</h2>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="content" class="form-label">Post</label>
                <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Post</button>
            <a href="{% url 'social_feed' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
